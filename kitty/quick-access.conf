# kitty config for the quick-access terminal (see quick-access-terminal.conf).
# Deliberately not the main kitty.conf: that one restores saved sessions at
# startup (startup_session), runs the agent watcher (a second poller would
# duplicate notifications), and loads the shader pipeline and vertical tab
# bar, none of which a scratch drop-down window wants. Just the font and theme.
font_size 18
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font        auto
italic_font      auto
include current-theme.conf
shell_integration no-title
