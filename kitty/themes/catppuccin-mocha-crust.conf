# Catppuccin Mocha for kitty, with the crust background.
# Values from https://github.com/catppuccin/kitty; the deviations are marked.
# Included (absolute path) by ~/.config/kitty/current-theme.conf and
# dark-theme.auto.conf.
foreground              #CDD6F4
# deviation: crust (#11111B), darker and less blue than Mocha's base #1E1E2E
background              #11111B
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
# deviation: red, to match the bell shader (Mocha's own is yellow #F9E2AF)
bell_border_color       #F38BA8

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

color0  #45475A
# deviation: overlay0 (#6C7086), Mocha's #585B70 is too faint for dim text
color8  #6C7086
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8
