# vim:ft=kitty
# kitty settings the shader pipeline in kitty/shaders/ depends on. Symlinked to
# ~/.config/kitty/shaders.conf and included from kitty.conf.

# Custom shaders (kitty >= 0.49): see shaders/gentle.pipeline
custom_shaders gentle

# The bell shader only gets bell-in-window events with a visual bell; 0.01s
# keeps kitty's own full-pane flash too short to see.
visual_bell_duration 0.01

# Rounded window borders (kitty >= 0.49). They need full borders
# (draw_minimal_borders no); padding keeps text clear of the corners.
# The shaders round their glows to the same corner: WINDOW_RADIUS_PX at the
# top of shaders/gentle.pipeline is this radius in pixels (2 x pt on Retina).
# The macOS window corner is about 15pt, so a pane in a window corner needs a
# radius a little above that or macOS clips the outer part of its border arc.
draw_minimal_borders no
window_border_radius 16
window_padding_width 3
