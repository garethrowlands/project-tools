# vim:ft=kitty
# kitty settings the shader pipeline in kitty/shaders/ depends on. Symlinked to
# ~/.config/kitty/shaders.conf and included from kitty.conf.

# Custom shaders (kitty >= 0.49): see shaders/gentle.pipeline
custom_shaders gentle

# The bell shader only gets bell-in-window events with a visual bell; a tiny
# duration (0.00001s) keeps kitty's own full-pane flash too short to see, and
# still counts as a visual bell. Any frame that does catch
# the flash is painted in the theme's background colour (catppuccin-mocha-crust)
# so it stays invisible; visual_bell_color none would use selection_background,
# a near-white pink. Update it if the theme's background changes.
visual_bell_duration 0.00001
visual_bell_color #11111B

# Rounded window borders (kitty >= 0.49). They need full borders
# (draw_minimal_borders no); padding keeps text clear of the corners.
# The radius is in pixels, not points, so it is the same on every display: the
# shaders round their glows to the same corner and can't be told the display
# scale. WINDOW_RADIUS_PX at the top of shaders/gentle.pipeline must match it.
draw_minimal_borders no
window_border_radius 32px
window_padding_width 3

# No title bar and no macOS window corners (macOS only). The shaders can only
# draw inside kitty's viewport, which sits below the title bar, so with one the
# focus effects stop short of the window's real top edge; and macOS's own
# rounded corner (about 15pt) clips the pane's border arc where a pane meets a
# window corner. Without both, kitty's rounded borders are the window's edge.
# Needs a kitty restart: changing this on a config reload is undefined.
hide_window_decorations titlebar-and-corners
