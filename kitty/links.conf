# Link clicking, included at the end of kitty.conf. Pairs with
# open-actions.conf and open_local.py.

# Cmd+click opens a link instantly, even inside programs that grab the mouse
# (micro, yazi). Plain click keeps kitty's default, which waits click_interval
# (the macOS double-click time, ~0.5s) to rule out a double click. This copies
# kitty's built-in ctrl+shift+click mappings, which act on release and swallow
# the press. (A plain-click release mapping with a "selection" guard doesn't
# work: the press has already started a selection, so the guard always fires.)
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# In a glow overlay opened by open_local.py, o opens the note in Obsidian
# (only if it is inside a vault; otherwise an error is shown).
map --when-focus-on var:kitty_md_path o kitten open_local.py --obsidian

# Cmd+P shows a menu of hint modes instead of silently waiting for a second
# key (see hint_menu.py). The two-key kitty_mod+p>X sequences from kitty's
# defaults and kitty.conf are unmapped so they don't compete with it; every
# one of them is in the menu.
map kitty_mod+p>c
map kitty_mod+p>d
map kitty_mod+p>f
map kitty_mod+p>shift+f
map kitty_mod+p>h
map kitty_mod+p>l
map kitty_mod+p>n
map kitty_mod+p>w
map kitty_mod+p>y
map kitty_mod+p kitten hint_menu.py
