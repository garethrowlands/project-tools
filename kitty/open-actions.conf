# Every local file link opens in a TUI, never a GUI app:
#   directory -> cd in the pane's zsh if idle at a prompt, else yazi
#   file#LINE -> micro at that line;  Markdown -> glow (e: edit, o: Obsidian)
#   other text -> micro;  anything else -> yazi with the file selected
# One kitten handles them all so eza's unescaped '#'/'?' names are repaired
# in one place. See open_local.py and kitty-cd-link.zsh.
# Non-file links (https:// etc.) are not matched and go to open_url_with.
protocol file
action kitten open_local.py ${FILE_PATH} ${URL}
