# A file reference in plain text (a compiler error, a stack trace, a grep hit),
# found by detect_url_regex in links.conf: path:line or path:line:column.
# `ide` opens it at that line, in the project's IDE; a relative path is looked
# for from the pane's directory upwards. Keep this and detect_url_regex describing the same thing.
# First, because kitty reads a scheme-less string as a file URL, which the rule
# below would otherwise take.
url ^[\w./~+@-]+\.[A-Za-z]\w*:\d+(:\d+)?$
action kitten open_local.py --ref ${URL}

# Every local file link opens in a TUI, never a GUI app (except the path:line
# references above, which go to the IDE):
#   directory -> cd in the pane's zsh if idle at a prompt, else yazi
#   file#LINE -> micro at that line;  Markdown -> mdfried (o: Obsidian, w: wide view)
#   other text -> micro;  anything else -> yazi with the file selected
# One kitten handles them all so eza's unescaped '#'/'?' names are repaired
# in one place. See open_local.py and kitty-cd-link.zsh.
# Non-file links (https:// etc.) are not matched and go to open_url_with.
protocol file
action kitten open_local.py ${FILE_PATH} ${URL}
